<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Кинопортал</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
    <div class="register-container">
        <div class="back-home">
            <a href="{% url 'home' %}">← Вернуться на главную</a>
        </div>
        
        <div class="logo">🎬 КИНОПОРТАЛ</div>
        <h1>Регистрация</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label>{{ field.label }}:</label>
                    {{ field }}
                    {% if field.help_text %}
                        <small>{{ field.help_text }}</small>
                    {% endif %}
                    {% if field.errors %}
                        <p style="color: red;">{{ field.errors }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit">Зарегистрироваться</button>
        </form>
        
        <p class="login-link">Уже есть аккаунт? <a href="{% url 'home' %}">Войти</a></p>
    </div>
</body>
</html>
